apiVersion: apps/v1
kind: Deployment
metadata:
  name: we-worker
  labels: { app.kubernetes.io/name: we-worker, app.kubernetes.io/part-of: wolf-enterprise }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: we-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: we-worker, app.kubernetes.io/part-of: wolf-enterprise }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: we/core:0.1.0   # substituir por registry/digest imutável no overlay
          command: ["we", "worker"]
          ports: [{ containerPort: 9101 }]
          envFrom:
            - configMapRef: { name: we-config }
            - secretRef: { name: we-secrets }   # injetado por External Secrets / Vault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe: { httpGet: { path: /healthz, port: 9101 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 9101 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
