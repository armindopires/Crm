# WE — Docker Compose por perfis (desenvolvimento local; não é configuração de produção).
# core: suficiente para a demonstração vertical. Restantes perfis são opcionais e não bloqueiam o núcleo.
name: we

x-we-env: &we-env
  WE_ENV: development
  WE_PG_HOST: postgres
  WE_PG_PORT: "5432"
  WE_PG_DB: we
  WE_PG_ADMIN_USER: we_admin
  WE_PG_ADMIN_PASSWORD: ${WE_PG_ADMIN_PASSWORD:?corra scripts/dev.py bootstrap}
  WE_PG_APP_PASSWORD: ${WE_PG_APP_PASSWORD:?}
  WE_PG_WORKER_PASSWORD: ${WE_PG_WORKER_PASSWORD:?}
  WE_NATS_URL: nats://nats:4222
  WE_REDIS_URL: redis://redis:6379/0
  WE_REDIS_PASSWORD: ${WE_REDIS_PASSWORD:?}
  WE_S3_ENDPOINT: http://objectstore:8333
  WE_S3_ACCESS_KEY: ${WE_S3_ACCESS_KEY:?}
  WE_S3_SECRET_KEY: ${WE_S3_SECRET_KEY:?}
  WE_S3_BUCKET: we-evidence
  WE_OIDC_ISSUER: ${WE_OIDC_ISSUER:-https://dev-idp.we.local}
  WE_OIDC_AUDIENCE: we-api
  WE_OIDC_JWKS_PATH: /run/we/dev-jwks.json
  WE_AUDIT_PSEUDONYM_KEY: ${WE_AUDIT_PSEUDONYM_KEY:?}
  WE_OTEL_EXPORTER_OTLP_ENDPOINT: ${WE_OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-we-python: &we-python
  build:
    context: ../..
    dockerfile: infra/containers/python.Dockerfile
    network: host
    secrets: [build_ca]
  image: we/core:dev
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - ../../.local/dev-jwks.json:/run/we/dev-jwks.json:ro

services:
  # ───────────── core ─────────────
  postgres:
    profiles: [core]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: we_admin
      POSTGRES_PASSWORD: ${WE_PG_ADMIN_PASSWORD:?}
      POSTGRES_DB: we
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U we_admin -d we"]
      interval: 3s
      timeout: 3s
      retries: 30

  nats:
    profiles: [core]
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    profiles: [core]
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${WE_REDIS_PASSWORD:?}", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${WE_REDIS_PASSWORD:?}

  # S3-compatible para evidências. MinIO era a opção indicada, mas a imagem não está disponível
  # neste ambiente (ADR-0004). A WE usa só a API S3, portanto MinIO/S3 real substituem sem alterar código.
  objectstore:
    profiles: [core]
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/we/s3.json",
              "-master.volumeSizeLimitMB=64", "-volume.max=0", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ../../.local/seaweed-s3.json:/etc/we/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O- http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    <<: *we-python
    profiles: [core]
    command: ["we", "migrate"]
    environment: *we-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *we-python
    profiles: [core]
    command: ["uvicorn", "we_core.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--no-server-header"]
    environment: *we-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *we-python
    profiles: [core]
    command: ["we", "worker"]
    environment:
      <<: *we-env
      WE_SERVICE_NAME: we-worker
    ports: ["127.0.0.1:9101:9101"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ───────────── ui ─────────────
  web:
    profiles: [ui]
    build:
      context: ../..
      dockerfile: infra/containers/web.Dockerfile
      network: host
      secrets: [build_ca]
    image: we/web:dev
    environment:
      WE_API_URL: http://api:8000
      WE_WEB_TOKEN_FILE: /run/we/web-token
    volumes:
      - ../../.local/web-token:/run/we/web-token:ro
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }

  # ───────────── identity (IdP OIDC de desenvolvimento; sem passwords) ─────────────
  dev-idp:
    <<: *we-python
    profiles: [identity]
    command: ["we", "dev-idp", "--host", "0.0.0.0", "--port", "8090"]
    environment: *we-env
    ports: ["127.0.0.1:8090:8090"]
    volumes:
      - ../../.local:/app/.local:ro

  # ───────────── orchestration ─────────────
  temporal:
    profiles: [orchestration]
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: we_admin
      POSTGRES_PWD: ${WE_PG_ADMIN_PASSWORD:?}
      POSTGRES_SEEDS: postgres
    ports: ["127.0.0.1:7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  # ───────────── knowledge (projeções reconstruíveis) ─────────────
  neo4j:
    profiles: [knowledge]
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${WE_NEO4J_PASSWORD:-change-me-local-only}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
  opensearch:
    profiles: [knowledge]
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # apenas local; nunca fora de desenvolvimento
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]

  # ───────────── observability ─────────────
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [../observability/otel-collector.yaml:/etc/otel/config.yaml:ro]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.2.1
    volumes: [../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
  loki:
    profiles: [observability]
    image: grafana/loki:3.4.2
    ports: ["127.0.0.1:3100:3100"]
  tempo:
    profiles: [observability]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [../observability/tempo.yaml:/etc/tempo.yaml:ro]
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${WE_GRAFANA_PASSWORD:-change-me-local-only}
    volumes: [../observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/we.yaml:ro]
    ports: ["127.0.0.1:3001:3000"]

  # ───────────── analytics ─────────────
  clickhouse:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_PASSWORD: ${WE_CLICKHOUSE_PASSWORD:-change-me-local-only}
    ports: ["127.0.0.1:8123:8123"]

secrets:
  # CA opcional para builds atrás de proxy com inspeção TLS (vazio por omissão).
  build_ca:
    file: ${WE_BUILD_CA_FILE:-../containers/no-extra-ca.pem}

volumes:
  pgdata:
  natsdata:
  s3data:
